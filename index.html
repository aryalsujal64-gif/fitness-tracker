<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness and Wellness Tracker</title>
<style>
:root{--bg:#eaf1ef;--card:#fff;--ink:#12302e;--mute:#58706d;--line:#cfdcd9;--accent:#0f6b5c;--accent-ink:#fff;--bad:#b3261e;--bad-bg:#fbe6e3;
--l1:#0f6b5c;--l2:#4d8f3f;--l3:#b7791f;--l4:#b3261e;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b1a;--card:#162826;--ink:#e3f0ed;--mute:#93aca8;--line:#2a403d;--accent:#4cc3ad;--accent-ink:#06201b;--bad:#ff9d94;--bad-bg:#3a1f1c;--l1:#4cc3ad;--l2:#8fd17f;--l3:#f0b95a;--l4:#ff9d94;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1b1a;--card:#162826;--ink:#e3f0ed;--mute:#93aca8;--line:#2a403d;--accent:#4cc3ad;--accent-ink:#06201b;--bad:#ff9d94;--bad-bg:#3a1f1c;--l1:#4cc3ad;--l2:#8fd17f;--l3:#f0b95a;--l4:#ff9d94;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Trebuchet MS",Verdana,sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font:700 1.7rem/1.1 Georgia,"Times New Roman",serif;margin:4px 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 14px;font-size:.92rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 13px;min-height:44px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--line);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{border:0;background:transparent;border-radius:9px;color:var(--mute)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);font-weight:700}
.msg{padding:10px 12px;border-radius:10px;margin-bottom:12px;background:var(--card);border:1px solid var(--line);font-size:.95rem}
.msg.err{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.rec{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--line));border-radius:12px;padding:12px 14px;margin-bottom:10px}
.rec h3{margin:0;font-size:1.05rem}
.rec .meta{color:var(--mute);font-size:.88rem}
.steps{font:700 1.6rem/1 Georgia,serif;margin:8px 0 2px}
.chip{display:inline-block;font-size:.85rem;font-weight:700;color:var(--c);border:1.5px solid var(--c);border-radius:99px;padding:1px 10px}
.facts{display:flex;gap:14px;flex-wrap:wrap;font-size:.92rem;margin-top:8px}
.warn{margin-top:8px;font-size:.9rem;color:var(--bad);background:var(--bad-bg);border-radius:8px;padding:6px 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
label{display:block;font-weight:700;font-size:.92rem;margin:12px 0 4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input[disabled]{opacity:.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font:700 1.7rem/1.1 Georgia,serif}
.lvl{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.lvl:last-child{border:0}
.empty{color:var(--mute);text-align:center;padding:28px 8px}
</style>
</head>
<body>
<main>
<h1>Fitness and Wellness Tracker</h1>
<p class="sub">Group 4 SYD – Group C · web version of the Python program, with the same rules</p>
<div class="bar">
  <button id="bSample">Load sample data</button>
  <button id="bSave">Save</button>
  <button id="bLoad">Load saved</button>
</div>
<div class="tabs" role="tablist">
  <button role="tab" id="t-records" aria-selected="true">Records</button>
  <button role="tab" id="t-form" aria-selected="false">Add</button>
  <button role="tab" id="t-summary" aria-selected="false">Summary</button>
</div>
<div id="msg" role="status" aria-live="polite"></div>
<section id="v-records"></section>
<section id="v-form" hidden></section>
<section id="v-summary" hidden></section>
</main>
<script>
// ---- Rules (same as calculations.py) ----
var MAX_STEPS=100000,MAX_SLEEP=24,MAX_WATER=20,MAX_EXERCISE=1440;
function classifyActivity(s){if(s>=10000)return"Highly active";else if(s>=7000)return"Active";else if(s>=4000)return"Moderately active";else return"Low activity";}
function targetReasons(steps,sleep,water){var r=[];if(steps<4000)r.push("steps below 4,000");if(sleep<6)r.push("sleep below 6 hours");if(water<1.5)r.push("water below 1.5 litres");return r;}
function isBelowTarget(steps,sleep,water){return steps<4000||sleep<6||water<1.5;}
function isValidDate(t){if(!/^\d{4}-\d{2}-\d{2}$/.test(t))return false;var d=new Date(t+"T00:00:00Z");return !isNaN(d)&&d.toISOString().slice(0,10)===t;}
function average(a){return a.length?a.reduce(function(x,y){return x+y;},0)/a.length:0;}
var COLORS={"Highly active":"var(--l1)","Active":"var(--l2)","Moderately active":"var(--l3)","Low activity":"var(--l4)"};
var SAMPLE="U001|Aisha Khan|2026-10-26|11200|7.5|2.2|45\nU001|Aisha Khan|2026-10-27|9800|7.0|2.0|30\nU002|John Smith|2026-10-26|7500|6.5|1.8|25\nU002|John Smith|2026-10-27|5200|5.5|1.2|15\nU003|Maria Lee|2026-10-26|3200|8.0|1.6|0\nU003|Maria Lee|2026-10-27|4500|7.0|1.4|20\nU004|Chen Wang|2026-10-26|8300|6.2|2.4|40\nU004|Chen Wang|2026-10-27|12500|7.8|2.6|60";
var records=[],editing=null,query="";
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function say(t,err){$("msg").innerHTML=t?'<div class="msg'+(err?' err':'')+'">'+esc(t)+'</div>':"";}
function num(text,lo,hi,whole,label){
  var t=String(text).trim();if(t==="")return{e:label+" is required."};
  var v=Number(t);if(!isFinite(v))return{e:label+" must be a number."};
  if(v<lo||v>hi)return{e:label+" must be between "+lo+" and "+hi+"."};
  if(whole&&!Number.isInteger(v))return{e:label+" must be a whole number."};
  return{v:v};}
// ---- Save / load (like storage.py, using the browser instead of a text file) ----
function toLine(r){return[r.uid,r.name,r.date,r.steps,r.sleep,r.water,r.exercise].join("|");}
function parseText(text){var out=[],seen={},skipped=0;text.split("\n").forEach(function(line){line=line.trim();if(!line)return;
  var p=line.split("|");if(p.length!==7){skipped++;return;}
  var st=num(p[3],0,MAX_STEPS,true,"s"),sl=num(p[4],0,MAX_SLEEP,false,"s"),wa=num(p[5],0,MAX_WATER,false,"s"),ex=num(p[6],0,MAX_EXERCISE,false,"s");
  if(!p[0].trim()||!p[1].trim()||!isValidDate(p[2].trim())||st.e||sl.e||wa.e||ex.e){skipped++;return;}
  var key=p[0].trim()+"|"+p[2].trim();if(seen[key]){skipped++;return;}seen[key]=1;
  out.push({uid:p[0].trim(),name:p[1].trim(),date:p[2].trim(),steps:st.v,sleep:sl.v,water:wa.v,exercise:ex.v});});
  return{list:out,skipped:skipped};}
function load(text,label){var r=parseText(text);records=r.list;say(r.list.length+" record(s) loaded from "+label+". "+r.skipped+" line(s) skipped.");render();}
$("bSample").onclick=function(){load(SAMPLE,"sample data");};
$("bSave").onclick=function(){try{localStorage.setItem("wellness",records.map(toLine).join("\n"));say("Saved "+records.length+" record(s) in this browser.");}catch(e){say("Could not save in this browser.",true);}};
$("bLoad").onclick=function(){var t=null;try{t=localStorage.getItem("wellness");}catch(e){}
  if(t===null){say("No saved data found. Save first, or load the sample data.",true);return;}load(t,"saved data");};
// ---- Views ----
function show(tab){["records","form","summary"].forEach(function(n){$("v-"+n).hidden=n!==tab;$("t-"+n).setAttribute("aria-selected",n===tab);});
  if(tab==="form")$("t-form").textContent=editing?"Update":"Add";render();}
["records","form","summary"].forEach(function(n){$("t-"+n).onclick=function(){if(n==="form"&&editing&&0){}if(n!=="form")editing=null;if(n==="form")say("");show(n);};});
function renderRecords(){
  var q=query.toLowerCase();
  var list=records.filter(function(r){return!q||r.uid.toLowerCase().indexOf(q)>-1||r.name.toLowerCase().indexOf(q)>-1;});
  var h='<label for="q" style="margin-top:0">Search by user ID or name</label><input id="q" type="search" value="'+esc(query)+'" placeholder="e.g. aisha or U003">';
  if(!records.length)h+='<p class="empty">No records yet. Tap “Load sample data” or add one.</p>';
  else if(!list.length)h+='<p class="empty">No matching records found.</p>';
  list.forEach(function(r){var lv=classifyActivity(r.steps),why=targetReasons(r.steps,r.sleep,r.water),i=records.indexOf(r);
    h+='<div class="rec" style="--c:'+COLORS[lv]+'"><div class="row"><div><h3>'+esc(r.name)+'</h3><div class="meta">'+esc(r.uid)+' · '+r.date+'</div></div><button data-edit="'+i+'">Edit</button></div>'+
    '<div class="steps">'+r.steps.toLocaleString("en-US")+' <span class="meta" style="font:inherit;font-size:.85rem">steps</span></div><span class="chip" style="--c:'+COLORS[lv]+'">'+lv+'</span>'+
    '<div class="facts"><span>Sleep '+r.sleep+' h</span><span>Water '+r.water+' L</span><span>Exercise '+r.exercise+' min</span></div>'+
    (why.length?'<div class="warn">Below target: '+why.join(", ")+'</div>':'')+'</div>';});
  $("v-records").innerHTML=h;
  var q2=$("q");q2.oninput=function(){query=q2.value;var p=q2.selectionStart;renderRecords();var n=$("q");n.focus();n.setSelectionRange(p,p);};
  Array.prototype.forEach.call(document.querySelectorAll("[data-edit]"),function(b){b.onclick=function(){editing=+b.getAttribute("data-edit");say("");show("form");};});}
function renderForm(){
  var r=editing!==null?records[editing]:{uid:"",name:"",date:new Date().toISOString().slice(0,10),steps:"",sleep:"",water:"",exercise:""},ed=editing!==null;
  $("t-form").textContent=ed?"Update":"Add";
  function f(id,lab,val,type,extra){return'<label for="'+id+'">'+lab+'</label><input id="'+id+'" value="'+esc(val)+'" '+(type||"")+' '+(extra||"")+'>';}
  $("v-form").innerHTML='<div class="card"><h2 style="margin:0 0 4px;font-size:1.1rem">'+(ed?"Update a wellness record":"Add a daily wellness record")+'</h2>'+
   f("fu","User ID",r.uid,"",ed?"disabled":'autocomplete="off"')+f("fn","Name",r.name,"",ed?"disabled":'autocomplete="off"')+f("fd","Date (YYYY-MM-DD)",r.date,"",ed?"disabled":'inputmode="numeric"')+
   f("fs","Steps (0–100000, whole number)",r.steps,'inputmode="numeric"')+f("fl","Sleep hours (0–24)",r.sleep,'inputmode="decimal"')+
   f("fw","Water in litres (0–20)",r.water,'inputmode="decimal"')+f("fe","Exercise minutes (0–1440)",r.exercise,'inputmode="numeric"')+
   '<div class="bar" style="margin:16px 0 0"><button class="primary" id="fsave">'+(ed?"Update record":"Add record")+'</button>'+(ed?'<button id="fcancel">Cancel</button>':'')+'</div></div>';
  $("fsave").onclick=submitForm;if(ed)$("fcancel").onclick=function(){editing=null;say("");show("records");};}
function submitForm(){
  var uid=$("fu").value.trim(),name=$("fn").value.trim(),date=$("fd").value.trim();
  if(!uid||!name){say("User ID and name cannot be empty.",true);return;}
  if(uid.indexOf("|")>-1||name.indexOf("|")>-1){say("The | character is not allowed in text fields.",true);return;}
  if(!isValidDate(date)){say("Invalid date. Use YYYY-MM-DD, for example 2026-11-01.",true);return;}
  var s=num($("fs").value,0,MAX_STEPS,true,"Steps"),l=num($("fl").value,0,MAX_SLEEP,false,"Sleep hours"),w=num($("fw").value,0,MAX_WATER,false,"Water"),x=num($("fe").value,0,MAX_EXERCISE,false,"Exercise minutes");
  var bad=[s,l,w,x].filter(function(o){return o.e;})[0];if(bad){say(bad.e,true);return;}
  if(editing!==null){var r=records[editing];r.steps=s.v;r.sleep=l.v;r.water=w.v;r.exercise=x.v;editing=null;say("Record updated.");show("records");return;}
  var dup=records.some(function(r){return r.uid===uid&&r.date===date;});
  if(dup){say("A record for "+uid+" on "+date+" already exists. Use Edit to update it.",true);return;}
  records.push({uid:uid,name:name,date:date,steps:s.v,sleep:l.v,water:w.v,exercise:x.v});say("Record added successfully.");show("records");}
function renderSummary(){
  if(!records.length){$("v-summary").innerHTML='<p class="empty">No records to summarise yet.</p>';return;}
  var users={},counts={"Highly active":0,"Active":0,"Moderately active":0,"Low activity":0},below=[];
  records.forEach(function(r){users[r.uid]=1;counts[classifyActivity(r.steps)]++;if(isBelowTarget(r.steps,r.sleep,r.water))below.push(r);});
  var h='<div class="card grid"><div><div class="big">'+Math.round(average(records.map(function(r){return r.steps;}))).toLocaleString("en-US")+'</div><div class="meta">average steps</div></div>'+
   '<div><div class="big">'+records.length+'</div><div class="meta">records from '+Object.keys(users).length+' users</div></div>'+
   '<div><div class="big">'+average(records.map(function(r){return r.sleep;})).toFixed(1)+' h</div><div class="meta">average sleep</div></div>'+
   '<div><div class="big">'+average(records.map(function(r){return r.water;})).toFixed(1)+' L</div><div class="meta">average water</div></div></div>'+
   '<div class="card"><strong>Activity levels</strong>';
  Object.keys(counts).forEach(function(k){h+='<div class="lvl"><span class="chip" style="--c:'+COLORS[k]+'">'+k+'</span><strong>'+counts[k]+'</strong></div>';});
  h+='</div><div class="card"><strong>Records below wellness target ('+below.length+')</strong>';
  if(!below.length)h+='<p class="meta">None. Everyone met all targets.</p>';
  below.forEach(function(r){h+='<div class="lvl"><span>'+esc(r.name)+' · '+r.date+'<br><span class="meta">'+targetReasons(r.steps,r.sleep,r.water).join(", ")+'</span></span></div>';});
  $("v-summary").innerHTML=h+'</div>';}
function render(){if(!$("v-records").hidden)renderRecords();if(!$("v-form").hidden)renderForm();if(!$("v-summary").hidden)renderSummary();}
render();
</script>
</body>
</html>
